name: blanc
base: core24
adopt-info: blanc
title: Blanc Browser
summary: A minimal, open-source desktop browser built around one small Island.
description: |
  Blanc replaces the usual tab strip and toolbar with a floating command pill.
  It keeps the current site, tab switching, navigation, search, and a live
  blocker count close at hand, then expands when you need more.
  
    - A quieter interface: 
      Island chrome, the Quick Switcher, tab groups, Quiet Tabs, Glance, 
      and multiple windows without a permanent toolbar.

    - Blocking built in:
      ads and trackers are filtered at the network layer from bundled, 
      hash-verified EasyList and EasyPrivacy snapshots.

    - Private and local choices: 
      private tabs use a separate in-memory session; local profiles, separate 
      site data, history, Favorites, downloads, and remembered permissions.

contact: https://github.com/ogra1/blanc-snap/issues
license: MIT
issues: https://github.com/ogra1/blanc-snap/issues
source-code: https://github.com/ogra1/blanc-snap
website: https://github.com/ogra1/blanc-snap

grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  blanc:
    extensions: [ gnome ]
    command: blanc/blanc --no-sandbox
    plugs:
      - audio-record
      - audio-playback
      - browser-support
      - camera
      - network
      - screen-inhibit-control

parts:
  blanc:
    plugin: nil
    source: https://github.com/bnfy/blanc.git
    source-tag: v1.26.0
    build-snaps:
      - node/26/stable
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags --abbrev=0 | cut -c 2-)
    override-build: |
      set +u
      # workaround for build.snapcraft.io builds
      # https://bugs.launchpad.net/bugs/1886861
      if [ -n "$http_proxy" ]; then
        export ELECTRON_GET_USE_PROXY=1
        export GLOBAL_AGENT_HTTP_PROXY="${http_proxy}"
        export GLOBAL_AGENT_HTTPS_PROXY="${http_proxy}"
      fi
      npm install
      npm run brand:build
      npm run dist:dir
      cp -a dist/linux-*unpacked $CRAFT_PART_INSTALL/blanc
